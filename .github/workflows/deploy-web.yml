name: Deploy web demo

# Builds the Flutter web version of this app and publishes it with GitHub Pages.
# Live at https://nainezz.github.io/todolist/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Flutter 3.3 (Dart 2.18), matching the era this project was written in
          flutter-version: '3.3.10'
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release --base-href /todolist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
